services:
  qoderwake:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qoderwake
    restart: unless-stopped
    # Chrome in Docker needs more shared memory than the default 64MB
    shm_size: 2gb
    ports:
      - "${QODERWAKE_PORT:-19820}:19820"
    environment:
      # Set your Qoder Personal Access Token for headless authentication
      # Generate one at: https://qoder.com (Account Settings → Personal Access Tokens)
      - QODER_PERSONAL_ACCESS_TOKEN=${QODER_PERSONAL_ACCESS_TOKEN:-}
      # Optional: Override host/port (defaults: 0.0.0.0 / 19820)
      - QODERWAKE_HOST=${QODERWAKE_HOST:-0.0.0.0}
      # EverMeMOS / EverOS. EVEROS_API_KEY is the value you actually set in Coolify.
      # IMPORTANT: these reach the QoderWake *daemon* only. The `everos` connector is
      # a stdio MCP server, and stdio servers inherit just HOME, LOGNAME, PATH, SHELL,
      # TERM, USER here. entrypoint.sh writes these three into a mode-600 volume file
      # (~/.qoderwake/.everos/credentials.env) that evermemos-launch.sh injects into
      # the connector process; point the connector's Command at that script.
      # ${env:VAR} is NOT expanded by QoderWake and the Console UI rejects env keys
      # like EVERMEMOS_API_KEY. See README -> "MCP Connector Environment Variables".
      - EVERMEMOS_API_KEY=${EVEROS_API_KEY:-}
      - EVERMEMOS_USER_ID=omp-user
      - EVERMEMOS_BASE_URL=https://api.evermind.ai
    volumes:
      # Persist QoderWake data (auth state, wakers, configs, projects)
      - qoderwake_data:/home/qoderwake/.qoderwake
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19820/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  qoderwake_data:
    driver: local
